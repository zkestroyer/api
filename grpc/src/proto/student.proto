syntax = "proto3";
package student;

message Student {
  string id = 1;
  string name = 2;
  string email = 3;
  string course = 4;
  int32 year = 5;
  float gpa = 6;
}

message StudentId { string id = 1; }
message Empty {}
message StudentList { repeated Student students = 1; }
message CreateStudentRequest { string name = 1; string email = 2; string course = 3; int32 year = 4; float gpa = 5; }
message UpdateStudentRequest { string id = 1; string name = 2; string email = 3; string course = 4; int32 year = 5; float gpa = 6; }
message DeleteResponse { bool success = 1; string message = 2; }

service StudentService {
  rpc GetStudents (Empty) returns (StudentList);
  rpc GetStudent (StudentId) returns (Student);
  rpc CreateStudent (CreateStudentRequest) returns (Student);
  rpc UpdateStudent (UpdateStudentRequest) returns (Student);
  rpc DeleteStudent (StudentId) returns (DeleteResponse);
}
